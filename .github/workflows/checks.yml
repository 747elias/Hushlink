name: Required checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows MSVC · format, lint, tests, release build
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.91.1 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          rustc --version --verbose
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-msvc-rust-1.91.1-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'tools/rfcomm-probe/Cargo.lock') }}
          restore-keys: windows-msvc-rust-1.91.1-v1-
      - name: Compile and link isolated Classic RFCOMM API probe
        run: cargo build --locked --manifest-path tools/rfcomm-probe/Cargo.toml --target x86_64-pc-windows-msvc --target-dir target/rfcomm-probe
      - name: Check distributed dependency notices
        run: python scripts/check-notices.py
      - name: Format
        run: cargo fmt --check
      - name: Strict lint
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Unit and integration tests
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Build native Windows release EXE
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Cache successfully compiled dependencies before runtime smoke
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Native Windows startup smoke
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Executable target/x86_64-pc-windows-msvc/release/hushlink.exe
      - name: Upload native startup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-startup-${{ github.sha }}
          path: smoke-report/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Record exact build commit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-artifact | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/hushlink.exe build-artifact/hushlink.exe
          [System.IO.File]::WriteAllText("$pwd/build-artifact/build-commit.txt", "$env:GITHUB_SHA`n", [System.Text.UTF8Encoding]::new($false))
          python scripts/check-pe.py build-artifact/hushlink.exe
      - name: Verify prospective release packaging without publishing
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^\"]+)"\r?$').Groups[1].Value
          ./scripts/package.ps1 -Version "v$version" -Commit "$env:GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-${{ github.sha }}
          path: build-artifact/*
          if-no-files-found: error
          retention-days: 14
