name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag never bypasses validation. These jobs rebuild and run all checks for
  # the tag's exact commit, independently of any branch CI result.
  checks:
    uses: ./.github/workflows/checks.yml
  package:
    name: Verify and package checked Windows binary
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-${{ github.sha }}
          path: build-artifact
      # Publish exactly the installer bytes that passed the required install smoke.
      # Rebuilding it here would discard that evidence because timestamps can differ.
      - name: Verify and reuse the exact checked release assets
        shell: pwsh
        run: |
          $builtCommit = (Get-Content build-artifact/build-commit.txt -Raw).Trim()
          if ($builtCommit -cne $env:GITHUB_SHA) { throw 'Build artifact commit mismatch' }
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^\"]+)"\r?$').Groups[1].Value
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag does not match Cargo.toml' }
          if (-not (Test-Path "docs/RELEASE-$env:GITHUB_REF_NAME.md")) { throw 'Release notes are missing' }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item build-artifact/release-assets/* release-assets/
          python scripts/verify-package.py --directory release-assets --tag "$env:GITHUB_REF_NAME" --commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Checked release assets failed verification' }
          if ((Get-FileHash "release-assets/Hushlink-v$version-windows-x64.exe").Hash -cne (Get-FileHash build-artifact/hushlink.exe).Hash) {
            throw 'Release EXE differs from the exact checked app'
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish verified prerelease
    needs: [checks, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: release-assets
      - name: Validate downloaded asset checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish new prerelease without overwriting existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          test -f "docs/RELEASE-${GITHUB_REF_NAME}.md"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" \
            --title "Hushlink $GITHUB_REF_NAME" --prerelease \
            --notes-file "docs/RELEASE-${GITHUB_REF_NAME}.md"
  verify-published:
    name: Download and verify published prerelease assets
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Independently download actual release assets and verify commit, hashes and PE
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-release.py --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --directory work/published-verification
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-verification-${{ github.sha }}
          path: |
            work/published-verification/verification.json
            work/published-verification/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
